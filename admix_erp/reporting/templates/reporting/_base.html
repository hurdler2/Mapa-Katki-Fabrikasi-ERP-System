<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>{% block title %}ADMIX-ERP Raporlar{% endblock %}</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f5f5f7; color: #222; }
  header { background: #1f2937; color: #fff; padding: 14px 24px; display: flex; gap: 20px; align-items: center; }
  header a { color: #cbd5e1; text-decoration: none; font-size: 14px; }
  header a:hover { color: #fff; }
  header h1 { font-size: 18px; margin: 0; margin-right: auto; }
  main { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .card .label { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 6px; color: #111827; }
  .card .sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eef2f7; font-size: 14px; }
  th { background: #f9fafb; color: #374151; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  h2 { font-size: 16px; color: #374151; margin: 24px 0 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  form.filter { display: flex; gap: 12px; align-items: end; margin-bottom: 20px; background: #fff; padding: 14px 18px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  form.filter label { font-size: 12px; color: #6b7280; display: block; }
  form.filter input { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  form.filter button { padding: 7px 14px; background: #1f2937; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .bad { color: #c62828; font-weight: 600; }
  .ok { color: #2e7d32; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>ADMIX-ERP · {% block section %}Rapor{% endblock %}</h1>
  <a href="/">Ana</a>
  <a href="{% url 'reporting:dashboard' %}">Üretim</a>
  <a href="/analytics/bi/">BI</a>
  <a href="/analytics/iso-audit/">ISO Denetim</a>
  <a href="/accounting/balance/">Muhasebe</a>
  <a href="/notifications/">Bildirimler</a>
  <a href="/admin/">Admin</a>
  {% if request.user.is_authenticated %}
    <span style="border-left:1px solid #475569;padding-left:16px;color:#94a3b8;font-size:13px">
      👤 {{ request.user.get_full_name|default:request.user.username }}
    </span>
    <form method="post" action="{% url 'logout' %}" style="display:inline;margin:0;padding:0">
      {% csrf_token %}
      <button type="submit" style="background:none;border:none;color:#f87171;font-size:14px;cursor:pointer;padding:0;text-decoration:underline">
        Çıkış
      </button>
    </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
