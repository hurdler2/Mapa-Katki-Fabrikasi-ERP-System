services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admix_erp}
      POSTGRES_USER: ${POSTGRES_USER:-admix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    env_file: .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
