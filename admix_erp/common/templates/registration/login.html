<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · ADMIX-ERP</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    color: #111827;
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 12px;
    padding: 40px 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .brand {
    text-align: center; margin-bottom: 32px;
  }
  .logo {
    font-size: 32px; font-weight: 700; color: #1e3a8a; letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .tagline {
    font-size: 13px; color: #6b7280; letter-spacing: 0.02em;
  }
  h1 {
    font-size: 18px; margin: 0 0 24px; color: #374151; font-weight: 600;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block; font-size: 13px; color: #4b5563; margin-bottom: 6px; font-weight: 500;
  }
  input[type=text], input[type=password] {
    width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 15px; transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus {
    outline: none; border-color: #1e3a8a;
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
  }
  button {
    width: 100%; padding: 12px; background: #1e3a8a; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-top: 8px; transition: background 0.15s;
  }
  button:hover { background: #1e40af; }
  .error {
    background: #fef2f2; color: #991b1b; padding: 10px 14px; border-radius: 8px;
    font-size: 13px; margin-bottom: 16px; border: 1px solid #fecaca;
  }
  .footer {
    margin-top: 24px; padding-top: 20px; border-top: 1px solid #e5e7eb;
    font-size: 12px; color: #6b7280; text-align: center; line-height: 1.5;
  }
  .footer a { color: #1e3a8a; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">ADMIX-ERP</div>
    <div class="tagline">Sıvı Beton Katkısı Üretim Yönetim Sistemi</div>
  </div>

  <h1>Sisteme Giriş</h1>

  {% if form.non_field_errors %}
    <div class="error">
      Kullanıcı adı veya parola hatalı. Lütfen tekrar deneyin.
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="id_username">Kullanıcı adı</label>
      <input type="text" name="username" id="id_username" autofocus required autocomplete="username">
    </div>
    <div class="field">
      <label for="id_password">Parola</label>
      <input type="password" name="password" id="id_password" required autocomplete="current-password">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Giriş Yap</button>
  </form>

  <div class="footer">
    Sorun mu yaşıyorsun? BT ekibiyle iletişime geç.<br>
    <a href="/admin/">BT / Sistem Yönetimi</a>
  </div>
</div>
</body>
</html>
